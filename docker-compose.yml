services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [todo-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [todo-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [todo-net]

  backend:
    build: ./backend
    image: todo-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/tododb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-secret
      APP_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3          # three identical API containers
    networks: [todo-net]

  worker:
    image: todo-backend
    command: ["node", "worker.js"]
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/tododb
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER:
      SMTP_PASS:
      MAIL_FROM: Todo App <no-reply@todo.local>
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [todo-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [todo-net]

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [todo-net]

networks:
  todo-net:
    driver: bridge

volumes:
  mongo_data:
